stages:
  - build_debug
  - run_unit_tests
  - build_release
  - trigger

cache:
    key: "$CI_PIPELINE_ID"
    paths:
    - ${BUILD_DIR}
  
before_script:
  - mkdir -p ${DEBUG_DIR}
  - mkdir -p ${RELEASE_SHARED_DIR}
  - mkdir -p ${RELEASE_STATIC_DIR}
  - export OMP_NUM_THREADS=${CPU_SIM}

build_debug:
  stage: build_debug
  script:
    - cd ${DEBUG_DIR}
    - cmake ../.. -DCMAKE_CXX_FLAGS="-g -O1 -Wall -Wpedantic -pedantic-errors -Wextra --coverage" -DTADAH_ENABLE_OPENMP=ON -DTADAH_BUILD_TESTS=ON
    - make -j ${CPU_BUILD}

run_unit_tests:
  stage: run_unit_tests
  script:
    - cd "${DEBUG_DIR}"
    - make test
    # Return to the project root:
    - cd "${CI_PROJECT_DIR}"
    # Use absolute paths for --filter so it actually includes src/ and include/:
    - |
      gcovr \
        --root "${CI_PROJECT_DIR}" \
        --object-directory "${DEBUG_DIR}" \
        --filter "^${CI_PROJECT_DIR}/(src|include)" \
        --exclude "tests" \
        --exclude "build"
  coverage: /^TOTAL.*\s+(\d+\%)$/

build_release_shared:
  stage: build_release
  script:
    - cd ${RELEASE_SHARED_DIR}
    - cmake ../.. -DCMAKE_BUILD_TYPE=Release -DTADAH_ENABLE_OPENMP=ON -DCMAKE_INSTALL_PREFIX=${INSTALL_PATH}
    - make -j ${CPU_BUILD}

build_release_static:
  stage: build_release
  script:
    - cd ${RELEASE_STATIC_DIR}
    - cmake ../.. -DCMAKE_BUILD_TYPE=Release -DTADAH_ENABLE_OPENMP=ON -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX=${INSTALL_PATH}
    - make -j ${CPU_BUILD}

trigger:
  stage: trigger
  trigger:
    project: tadah/models
    branch: $CI_COMMIT_REF_NAME
