stages:
  - build
  - build.tests
  - run.tests
  - trigger

before_script:
  - DEBUG_DIR=build_debug
  - RELEASE_DIR=build_release
  - mkdir -p ${DEBUG_DIR}
  - mkdir -p ${RELEASE_DIR}
  - export PATH=$PATH:~/.local/bin
  - export CPATH=$CPATH:~/.local/include
  - export LIBRARY_PATH=$LIBRARY_PATH:~/.local/lib
  - export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:~/.local/lib
  - export OMP_NUM_THREADS=4

build-debug:
  stage: build
  script:
    - cd ${DEBUG_DIR}
    - cmake .. -DCMAKE_BUILD_TYPE=Debug"
    - make -j ${OMP_NUM_THREADS}

build-tests:
  variables: 
    GIT_CLEAN_FLAGS: -ffdx -e build/
  stage: build.tests
  needs: [build-debug]
  script:
    - cd ${DEBUG_DIR}
    - cmake .. -DTADAH_ENABLE_OPENMP=ON -DTADAH_BUILD_TESTS=ON -DCMAKE_CXX_FLAGS="--coverage -g -O1"
    - make -j ${OMP_NUM_THREADS}
    - rm -rf _deps
    - find . -name "*.a" -exec rm {} +
    - find . -name "*.o" -exec rm {} +
  artifacts:
    paths:
      - "${DEBUG_DIR}"

run-tests-1:
  stage: run.tests
  needs: [build-tests]
  script:
    - ta-dah --version
    - ta-dah --help

run-tests-2:
  stage: run.tests
  needs: [build-tests]
  script:
    - cd ${DEBUG_DIR}
    - make test
    - gcovr --exclude='.*/Eigen/.*' --exclude='.*/catch2/.*' --exclude='.*/tests/.*' --exclude='.*/CLI11/.*' --exclude='.*/toml11/.*' -r ..
  coverage: /^TOTAL.*\s+(\d+\%)$/

build-release-shared:
  stage: build
  script:
    - cd ${RELEASE_DIR}
    - cmake .. -DCMAKE_BUILD_TYPE=Release -DTADAH_ENABLE_OPENMP=ON "
    - make -j ${OMP_NUM_THREADS}

build-release-static:
  stage: build
  needs: [build-release-shared]
  script:
    - cd ${RELEASE_DIR}
    - cmake .. -DCMAKE_BUILD_TYPE=Release -DTADAH_ENABLE_OPENMP=ON -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX=~/.local"
    - make -j ${OMP_NUM_THREADS}
    - make install


trigger_job:
  stage: trigger
  needs: [run-tests-1, run-tests-2, build-release-shared, build-release-static]
  trigger:
    project: tadah/tadah.models