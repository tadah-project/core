various basis functions) are possible.

M_KRR takes the kernels Kern_Linear, Kern_RBF, Kern_Polynomial,
Kern_Quadratic, Kern_LQ and Kern_Sigmoid (their parameters: MPARAMS), and
M_BLR the basis functions BF_Linear and BF_Polynomial2. The third token of
M_KRR is its implementation: 1 (the default) fits energies, forces and
stresses by least squares over the design matrix; 2 fits energies only: it
solves (K + LAMBDA I) w = t, with K the kernel matrix of the basis vectors
and t the energy per atom of each drawn structure (0 for e0). Every kernel
but Kern_Linear works on SBASIS basis vectors (see SBASIS).
