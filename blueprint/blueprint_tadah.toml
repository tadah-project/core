# work in progress
[TASKS.explain]
description      = "Explain tadah command or option in more detail."
long_description      = "This is a help command that provides detailed information about a specific command or option in the Tadah! software. It is useful for users who want to understand the purpose and usage of a particular command or option."
examples         = ["tadah explain task", "tadah explain train.verbose", "tadah explain data.split.even"]

[TASKS.explain.keys]
INHERIT = ["ALLOWED_KEYS.option"]
[TASKS.explain.keys.option]
description = "Command or option to explain in a dot separated format."
long_description = "The command or option to explain. The format is dot-separated, where each part represents a level of the command hierarchy. For example, to explain the 'verbose' option of the 'train' command, you would use 'train.verbose'."
value_format = ["<command>", "<command>.<option>", "<command>.<subcommand>.<option>"]
cli_required = true
examples = ["tadah explain train.task", "tadah explain data.split.even"]

