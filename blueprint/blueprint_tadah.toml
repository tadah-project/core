[TASKS.data.dedup]
description      = "Remove duplicate structures from a dataset."
long_description = "Remove duplicate structures from Tadah! dataset(s). Two structures are the same when their cells agree and each atom matches a distinct atom of the same element, in any order and through the periodic cell, within --threshold (Angstrom, each Cartesian component; required). The first of each set of equal structures is kept, in the order of the files. Comparing a structure with a singular cell (zero or coplanar lattice vectors) is an error, and so is a threshold at which two periodic images of one position could both match (from 1/(2 sqrt 3), about 0.2887, of the shortest lattice vector). The merge option combines output into single file."
examples         = ["tadah data dedup -d db1.tadah db2.tadah -o dedup1.tadah dedup2.tadah --threshold 1e-6", "tadah data dedup -d db1.tadah db2.tadah -o db_merged.tadah --merge --threshold 1e-6"]
[TASKS.data.dedup.keys]
INHERIT          = ["ALLOWED_KEYS.outfile", "ALLOWED_KEYS.numeric", "ALLOWED_KEYS.verbose", "ALLOWED_KEYS.threshold", "ALLOWED_KEYS.merge", "ALLOWED_KEYS.append"]
