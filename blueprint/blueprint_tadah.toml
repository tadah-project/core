[TASKS.data.balance]
description = "Apply energy shifts and/or rescaling to a dataset."
long_description = """
Modify a dataset by applying element-specific energy shifts or rescaling
the weights for energies, forces, and stresses. The procedure can include
threshold checks, forcing near-zero values to a default weight, while large
magnitudes are inversely weighted. The updated dataset is then written to
one or more output files, which can be merged if desired. This approach
enhances the dataset's consistency and is especially useful when refining
potential parameters or emphasizing certain configurations during training.
"""
examples         = ["tadah data balance -d db.tadah --rescale --eshift 0.5 --numeric 16 --outfile balanced.tadah", "tadah data balance -d db1.tadah db2.tadah --rescale --outfile balanced1.tadah balanced2.tadah"]
[TASKS.data.balance.keys]
INHERIT          = ["ALLOWED_KEYS.outfile", "ALLOWED_KEYS.eshift", "ALLOWED_KEYS.rescale", "ALLOWED_KEYS.numeric", "ALLOWED_KEYS.verbose", "ALLOWED_KEYS.append", "ALLOWED_KEYS.merge", "ALLOWED_KEYS.threshold", "ALLOWED_KEYS.force", "ALLOWED_KEYS.stress", "ALLOWED_KEYS.index"]
[TASKS.data.balance.keys.index]
long_description = """
The 1-based indices of the structures to shift and rescale, counted over the
input files in order, each between 1 and their total number of structures:
single indices, ranges start-stop and intervals start-stop:step, separated by
commas or spaces (spaces around '-' and ':' are allowed). Repeated indices are
removed. A descending range, a step of 0, a malformed or empty entry and an
index outside the dataset are refused, naming it. Without --index every
structure is processed.
"""
[TASKS.data.balance.keys.force]
description = "Apply rescaling to forces."
[TASKS.data.balance.keys.stress]
description = "Apply rescaling to stresses."
[TASKS.data.balance.keys.threshold]
INHERIT = ["TYPES.DOUBLES"]
description = "Floating point thresholds for energy, force, and stress."
long_description = """
If energy or the sum of force norms or the stress matrix norm exceeds the
corresponding threshold, the relevant quantity will be rescaled using an
inverse weighting..
"""
default_value = ["1e-4", "1e-5", "1e-6"]
value_N = [-3]
[TASKS.data.balance.keys.rescale]
description = "Rescale structure weights."
long_description = """
Applies inverse weighting to energies, forces, and stresses based on their
magnitudes. Specifically:
  • Energies: 1 / | energy |
  • Total force: 1 / Σ‖ force_i ‖
  • Stress: 1 / ‖stress‖
This ensures smaller magnitudes keep their weights, while large values are
downweighted to mitigate numerical instability. A weight of 0 is kept: it
marks a quantity the structure has no data for (tadah data convert writes
it for a structure without forces or stress) or that is excluded.
"""
[TASKS.data.balance.groups.input]
description      = "Select from the following options:"
cli_required = true
required_min = 1
required_max = 1
[TASKS.data.balance.groups.input.keys]
INHERIT          = ["ALLOWED_KEYS.dbfile", "ALLOWED_KEYS.task"]
[TASKS.data.balance.groups.input.keys.dbfile]
cli_excludes   = ["task"]
cli_needs = ["outfile"]



