default_value = ["pot.tadah"]
value_N = [1]
description = "Output file name for the trained model."
long_description = """
Output file name for the trained model. 
"""
value_type   = ["STRING"]
value_format = ["<file>"]
[TASKS.train.groups.input]
description      = "Provide a configuration file for a single task or a complete tasks file."
cli_required = true
required_min = 1
required_max = 1
[TASKS.train.groups.input.keys]
INHERIT          = ["ALLOWED_KEYS.config", "ALLOWED_KEYS.task"]

[TASKS.predict]
description = "Predict properties using a trained model."
long_description = """
Predict using an already trained model. Energy per atom is always calculated,
while forces and stresses are optional. By default, energies are written to
energy.pred, and if forces or stresses are calculated, they are written to
forces.pred and stress.pred, respectively. You can use a task file with a DBFILE
key to list prediction datasets or STRUCTURE to list files or online structures
(see tadah explain predict.structure for supported types). Alternatively, you
can provide Tadah! datasets or individual structure files or online sources via
the command line.
"""
examples         = ["tadah predict -p pot.tadah -s crystal1.cif crystal2.cif --force", "tadah predict -p pot.tadah -d db1.tadah --numeric 12", "tadah predict -p pot.tadah -d db.tadah --stress --outfile predicted_energy.dat predicted_stresses.dat"]
[TASKS.predict.keys]
INHERIT          = ["ALLOWED_KEYS.potential", "ALLOWED_KEYS.force", "ALLOWED_KEYS.stress", "ALLOWED_KEYS.error", "ALLOWED_KEYS.analytics", "ALLOWED_KEYS.numeric", "ALLOWED_KEYS.verbose", "ALLOWED_KEYS.outfile"]
