[TASKS.analysis.check_bounds]
description      = "Validate HPO bounds: at every corner of the OPTIM box, run the pre-flight audit. Returns non-zero if any corner trips a FAIL finding. CI-friendly."
long_description = """
Phase 7 of the HPO bound-validation pipeline. Reads the HPOTARGET file
referenced by the seed config, parses every `OPTIM <KEY> (range) <lo> <hi>`
line into a Bound, samples corners (full 2^k for k <= 12, otherwise a
Latin-hypercube subsample of `min(2^k, ceil(k log2(k)))`), and runs the
Phase 5 pre-flight audit (`run_preflight_from_db`) at each corner in the
context tadah hpo evaluates: the seed with each bound's value in its own
entry of the key (OPTIM KEY (i) sets entry i; the other entries keep the
seed's values). A corner below the low bound tadah hpo refuses a box by
is a FAIL finding as well: for a DM_REAM seed, which must declare RHOFORM,
the density form's (under NONNEG and MONOTONE: AMPGRIDMB >= 0, WATOM > 0,
and SGRIDMB > 0 under MONOTONE and for a Gaussian density under NONNEG),
and in every form a radial bump width > 0 (SGRIDMB of a Blip or Blip5
density, SGRID2B of a D2_Blip or D2_Blip5 pair term).
Returns exit code 0 if all corners pass and 1 if any corner produces a
FAIL finding.
"""
examples         = ["tadah analysis check_bounds -c train.tadah --hpo-target config.hpo"]
[TASKS.analysis.check_bounds.keys]
INHERIT          = ["ALLOWED_KEYS.verbose", "ALLOWED_KEYS.hpotarget"]
[TASKS.analysis.check_bounds.groups.input]
description      = "Provide a training config and an HPOTARGET file."
cli_required = true
required_min = 1
required_max = 1
[TASKS.analysis.check_bounds.groups.input.keys]
INHERIT          = ["ALLOWED_KEYS.config", "ALLOWED_KEYS.task"]
[TASKS.analysis.check_bounds.groups.input.keys.config]
cli_excludes   = ["task"]

[TASKS.analysis.bfunc]
description      = "Evaluate and plot basis functions."
long_description = "Long description: Evaluate and plot basis functions."
examples         = ["tadah analysis bfunc -p pot.tadah -o bfunc.txt -r 0 5 500 --type 2b Y"]
[TASKS.analysis.bfunc.keys]
INHERIT          = ["ALLOWED_KEYS.outfile", "ALLOWED_KEYS.range", "ALLOWED_KEYS.type", "ALLOWED_KEYS.numeric", "ALLOWED_KEYS.verbose", "ALLOWED_KEYS.derivative", "ALLOWED_KEYS.index", "ALLOWED_KEYS.rescale"]
[TASKS.analysis.bfunc.keys.type]
value_N = [-2]
description  = "Basis function type. \"2b Y\" or \"mb N\"."
long_description  = """
Choice of basis function. For example: \"2b Y\" or \"mb N\".
Where Y/N controls computation of the cutoff function.
"""
[TASKS.analysis.bfunc.keys.index]
description = "Basis-function indices."
long_description = """
The 1-based indices of the basis functions to evaluate, in the given order,
each between 1 and the number of functions of the descriptor (the number of
its CGRID2B or CGRIDMB values; of each descriptor of a D2_mJoin or DM_mJoin
line): single indices, ranges start-stop and intervals start-stop:step,
separated by commas or spaces (spaces around '-' and ':' are allowed; several
values form one list). Repeated indices are removed. A descending range, a
step of 0, a malformed or empty entry and an index outside the functions are
refused, naming it. Without --index every function is evaluated.
"""
[TASKS.analysis.bfunc.keys.rescale]
description = "Rescale the basis function by the cutoff function. This is useful for visualisation purposes."
[TASKS.analysis.bfunc.keys.outfile]
INHERIT = ["TYPES.STRING"]
[TASKS.analysis.bfunc.groups.input]
description      = "Provide either a potential file, a configuration file, or a task file."
cli_required = true
required_min = 1
required_max = 1
[TASKS.analysis.bfunc.groups.input.keys]
INHERIT          = ["ALLOWED_KEYS.potential", "ALLOWED_KEYS.config", "ALLOWED_KEYS.task"]
[TASKS.analysis.bfunc.groups.input.keys.potential]
cli_excludes   = ["task", "config"]
cli_needs = ["range", "type"]
[TASKS.analysis.bfunc.groups.input.keys.config]
cli_excludes   = ["task", "potential"]
cli_needs = ["range", "type"]

[TASKS.analysis.cutoff]
description      = "Evaluate and plot cutoff functions."
long_description = "Long description: Evaluate and plot cutoff functions."
examples         = ["tadah analysis cutoff -o cutoff.txt -r 0 3.14 100 -t \"CutCos\" --derivative"]
[TASKS.analysis.cutoff.keys]
INHERIT          = ["ALLOWED_KEYS.outfile", "ALLOWED_KEYS.range", "ALLOWED_KEYS.numeric", "ALLOWED_KEYS.verbose", "ALLOWED_KEYS.derivative"]
[TASKS.analysis.cutoff.groups.input]
description      = "Provide either a cutoff type or a task file."
cli_required = true
required_min = 1
required_max = 1
[TASKS.analysis.cutoff.groups.input.keys]
INHERIT          = ["ALLOWED_KEYS.type", "ALLOWED_KEYS.task"]
[TASKS.analysis.cutoff.groups.input.keys.type]
cli_excludes   = ["task"]
cli_needs = ["range"]

