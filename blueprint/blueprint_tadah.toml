[TASKS.refit]
description      = "Refit a tabulated EAM potential into a native Tadah model."
long_description = """
Convert a tabulated EAM potential (setfl format: eam/alloy or eam/fs, single
element) into a native Tadah model: the pair, density and embedding functions
are re-fitted with flexible Tadah basis functions. The result can be used
directly or tuned further with `tadah hpo`.

Output files (default name, config key):
- pot.tadah (OUTFILE, -o): the fitted Tadah potential, for `tadah predict`,
  LAMMPS pair_style tadah, and as the seed for `tadah hpo`.
- refit.eam (SETFL_OUT): setfl table rebuilt from the fitted functions, for
  side-by-side comparison with the input potential in LAMMPS.
- refit.hpotarget (HPOFILEOUT, --hpofileout): ready-to-run `tadah hpo` target
  file with search bounds around the fitted parameters.
- refit_opt.log (REFIT_LOG): live fit log, updated during the run.
- refit_curve_{phi,rho,F}.dat, refit_compare.dat, refit_range_report.dat:
  diagnostics with fitted vs original curves, residuals, fit windows.

Config-file options (EAM and RHOFORM are required):
- EAM <file>: input setfl potential to refit (required).
- RHOFORM SIGNED|NONNEG|MONOTONE (required): the density form of the
  written DM_REAM potential. SIGNED is the density of every tadah before
  1.6.0; NONNEG fits non-negative amplitudes (rho >= 0); MONOTONE fits
  integrated-bump steps with non-negative amplitudes (rho >= 0 and
  non-increasing). Every form fits in both REFIT_MODEs. MONOTONE needs a
  bump basis: set REFIT_BASIS Blip or Blip5, since the compact default is
  Knot5 (Gaussian works with REFIT_MODE dense only). NONNEG with a knot
  basis fits only non-increasing convex densities; REFIT_BASIS Blip5 lifts
  that lock.
  A table the form cannot follow (NONNEG: rho < 0 in the fit window;
  MONOTONE: a rising rho) is refused before fitting.
- REFIT_MODE: compact (default; small optimised basis) | dense (fast
  fixed grids).
- REFIT_BASIS: basis family. Knot5 (compact default) | Blip (dense
  default) | Blip5 | Knot3 | KnotMix.
- REFIT_TOL_AMBIENT / REFIT_TOL_COMPRESSED: accuracy targets in meV/atom
  near equilibrium / under compression (defaults 0.1 / 1.0).
- REFIT_REACH_SMIN: smallest compression a/a0 the fit must stay accurate
  at (default 0.75).
- OPTIM_PCT: +-percent search bounds written to the hpotarget file
  (default 5).
- OUTPUT_GRID_SCALE: output setfl grid density relative to the input
  (default 1.0).
- The numbers are read strictly before the EAM file, each within its range
  (`tadah explain refit.<key>`): e.g. the tolerances, OPTIM_PCT and
  OUTPUT_GRID_SCALE > 0, REFIT_REACH_SMIN from 0.1 to 1,
  REFIT_COMPACT_SEED 0 to 4294967295; an error names the key and the
  value.
- Dense mode only: REFIT_LEVEL (coarse|balanced|fine|accurate), N2B,
  NRHO_BASIS, NF_BASIS, REFIT_MAX_ESCALATIONS.
- Compact ladder: REFIT_COMPACT_NMAX, REFIT_COMPACT_STALL,
  REFIT_COMPACT_SHARE, REFIT_COMPACT_OPT_EVERY, REFIT_COMPACT_INSERT_TOPK,
  REFIT_COMPACT_SEED.
- Stage pipeline (compact mode): INIT -> EXPLORE -> REFINE -> FUSE, each its
  own multi-line block. INIT (no optimisation) declares manual/anchored,
  optionally PINned knots/blips. EXPLORE/REFINE/FUSE each take a nested
  OPTIMIZER block with ALGO (required), LIB (required with an ALGO that
  runs an optimiser, naming its library) and the stage's stop criteria,
  written as in `tadah hpo`; a key its ALGO does not read is an error.
  Omit any block to use its defaults (default EXPLORE = global MLSL + inner
  SBPLX). See HPO_REFIT_2B_EAM/REDESIGN/configs for examples.
- Embedding reference: EMBF0 ZERO|FREE (default ZERO) — the written
  potential's DM_REAM embedding reference. ZERO fits the zero-referenced
  embedding F(rho) - F(0) against F_tab(rho) - F_tab(0) (refit.eam F[0] = 0);
  FREE fits the raw embedding of tadah 1.5.0. `--edit` edits F in the
  input potential's reference and writes it.
- Advanced: REFIT_PLACEMENT, REFIT_REACH_MARGIN, REFIT_R_LO_FRAC,
  REFIT_CONSTRAIN_F0 (dense mode, EMBF0 FREE only).

Two additional modes operate on EXISTING refit outputs instead of a
tabulated EAM file:
- --edit <pot.tadah>: add or remove one basis function of one curve
  (--func {phi|rho|F} with --add <centre> or --remove <centre>). Adding
  uses a zero coefficient, so the potential is unchanged until `tadah hpo`
  varies the new dimension (exact unless the input potential carries
  NUMERIC < 17, e.g. the NUMERIC 12 of 1.5.0 hpo pots); removing compensates
  via the neighbouring coefficients (under RHOFORM NONNEG or MONOTONE
  they stay >= 0). The input potential must declare RHOFORM, which the
  edited potential keeps. Writes an edited potential and a regenerated
  hpotarget.
- --retarget <file.hpotarget>: rewrite the OPTIM search bounds of an
  existing hpotarget (--pct global or KEY=N per-key percentages,
  --set 'KEY(i)=lo,hi' absolute overrides, --in-place, and --rhoform
  SIGNED|NONNEG|MONOTONE for the density form of the potential the file
  searches around: non-negative AMPGRIDMB boxes and the RHOFORM header line
  under NONNEG/MONOTONE). A configuration may not set RHOFORM or EMBF0 for
  --retarget (no effect on an hpotarget); for --edit it may set them only to
  the potential's own values.
For knot-family potentials both modes keep RCUT2B/RCUTMB consistent with
the largest knot position (the true effective cutoff).

Run `tadah explain refit.<key>` (e.g. `tadah explain refit.refit_mode`) for
the full description of any key.
"""
examples         = ["tadah refit -c refit.cfg", "tadah refit -c refit.cfg -v 2", "tadah refit --edit pot.tadah --func phi --add 2.75", "tadah refit --edit pot.tadah --func F --remove 0.9", "tadah refit --retarget refit.hpotarget --pct 10 FIXWEIGHT=2", "tadah refit --retarget refit.hpotarget --pct 10 --rcut2b 6.0 --rcutmb 6.0 -o wide.hpotarget", "tadah refit --retarget refit.hpotarget --set 'CGRID2B(3)=2.1,2.4' --in-place"]
[TASKS.refit.keys]
INHERIT          = ["ALLOWED_KEYS.verbose", "ALLOWED_KEYS.outfile", "ALLOWED_KEYS.setfl_out", "ALLOWED_KEYS.refit_basis", "ALLOWED_KEYS.refit_level", "ALLOWED_KEYS.n2b", "ALLOWED_KEYS.nrho_basis", "ALLOWED_KEYS.nf_basis", "ALLOWED_KEYS.optim_pct", "ALLOWED_KEYS.output_grid_scale", "ALLOWED_KEYS.hpofileout", "ALLOWED_KEYS.refit_tol_ambient", "ALLOWED_KEYS.refit_tol_compressed", "ALLOWED_KEYS.refit_max_escalations", "ALLOWED_KEYS.refit_placement", "ALLOWED_KEYS.refit_reach_smin", "ALLOWED_KEYS.refit_reach_margin", "ALLOWED_KEYS.refit_constrain_f0", "ALLOWED_KEYS.refit_r_lo_frac", "ALLOWED_KEYS.refit_mode", "ALLOWED_KEYS.refit_log", "ALLOWED_KEYS.refit_compact_nmax", "ALLOWED_KEYS.refit_compact_opt_every", "ALLOWED_KEYS.refit_compact_stall", "ALLOWED_KEYS.refit_compact_insert_topk", "ALLOWED_KEYS.refit_compact_share", "ALLOWED_KEYS.refit_compact_seed", "ALLOWED_KEYS.refit_compact_samples", "ALLOWED_KEYS.refit_compact_jitters", "ALLOWED_KEYS.refit_compact_merge", "ALLOWED_KEYS.refit_objective", "ALLOWED_KEYS.refit_curve_deriv_weight", "ALLOWED_KEYS.refit_curve_weighting", "ALLOWED_KEYS.refit_curve_relax", "ALLOWED_KEYS.optimizer", "ALLOWED_KEYS.init", "ALLOWED_KEYS.explore", "ALLOWED_KEYS.refine", "ALLOWED_KEYS.fuse", "ALLOWED_KEYS.func", "ALLOWED_KEYS.add", "ALLOWED_KEYS.remove", "ALLOWED_KEYS.eta", "ALLOWED_KEYS.deg", "ALLOWED_KEYS.pct", "ALLOWED_KEYS.set", "ALLOWED_KEYS.retarget_rcut2b", "ALLOWED_KEYS.retarget_rcutmb", "ALLOWED_KEYS.retarget_rhoform", "ALLOWED_KEYS.in_place"]
