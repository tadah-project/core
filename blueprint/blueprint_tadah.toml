[ALLOWED_KEYS.SETFL]
INHERIT = ["TYPES.STRING"]
description = """Path to the setfl (LAMMPS eam/alloy) file read by D2_EAM (pair function) and DM_EAM (density and embedding)."""
long_description = """
A single-element setfl file (LAMMPS eam/alloy, or eam/fs, which has the same
layout for one element) holds the three EAM functions: D2_EAM reads the pair
function phi(r) and DM_EAM the density rho(r) and the embedding function
F(rho), so one SETFL serves the usual D2_EAM + DM_EAM pair. Each descriptor
takes one parameter on its TYPE line, a placeholder written 0
(TYPE2B D2_EAM 0 Ta Ta, TYPEMB DM_EAM 0 Ta Ta); another value has no effect
and is reported once on standard error. RCUT2B and RCUTMB must be the
file's cutoff (in a D2_mJoin or DM_mJoin, the EAM descriptor's own value):
the file defines its functions up to it. Another value is refused, naming
both, and so is, at the start of tadah hpo, an OPTIM RCUT2B/RCUTMB over
that value. A potential written with NUMERIC below 17 records the cutoff
rounded, and is refused until it is set to the file's cutoff.

The file is read as LAMMPS pair_style eam/alloy reads it: lines 1-3 are
comments; from line 4 on, '#' starts a comment and a line without words is
skipped; then the element line '1 <symbol>', the grid line
'nrho drho nr dr rcut', the element record 'Z mass a lattice' and the
F(rho), rho(r) and r*phi(r) tables (nrho, nr and nr values), each starting on
a new line. A malformed file is refused, naming the file, the line and the
field: nrho or nr not a whole number of at least 3 (the spline fitted through
a table reads its third point), drho, dr or rcut not a positive finite
number, a header line with a word too many or too few, a table value that is
not a finite decimal number, a short table, or a table whose last line holds
values of the next (LAMMPS drops them). Lines after the last table are not
read.

A configuration with both descriptors and one setfl file::

    INIT2B    true
    TYPE2B    D2_EAM 0 Ta Ta
    RCTYPE2B  Cut_Dummy
    RCUT2B    5.58190742024
    INITMB    true
    TYPEMB    DM_EAM 0 Ta Ta
    RCTYPEMB  Cut_Dummy
    RCUTMB    5.58190742024
    SETFL     Ta.eam.alloy
"""
examples = ['Ta1_Ravelo_2013.eam.alloy']


[ALLOWED_KEYS.structure]
INHERIT = ["TYPES.STRINGS"]
value_N      = [2147483647]
description  = "Unified structural input(s)."
long_description = """
Supported file formats: .cif (Crystallographic Information File), VASP
(POSCAR/CONTCAR), and CASTEP (.cell). The online option fetches structures
from databases (MP mp-<n>, COD cod-<n>, AFLOW aflow:<auid>, NOMAD).
Multiple structures can be space-separated or repeated. A mix of files and
online sources is allowed.
A CIF's space group comes from its symmetry-operator loop, else its Hall
symbol, else its H-M symbol (also as P2_1/c, P2(1)/c, 'P 21/c (No. 14)' or
the full symbol, 'I 4/m -3 2/m'; ICSD's ' S' and ' Z' suffixes name origin
choice 1 and 2), else its number (1 to 230), in the setting named or else
the standard one (origin choice 2, hexagonal or rhombohedral axes from the
cell angles): a number gives a WARNING naming the setting used when the
cell could be in another, and a symbol used that cannot be read is refused
(next to an operator loop that forms a group, a WARNING). A monoclinic
group in a setting of gemmi's table, or with the rotations of one, must
fit the cell (the angles between its unique axis and the other axes 90
degrees; a short symbol or a number means unique axis b, except B 2, B m,
B b, B n, B 2/m, B 2/b and B 2/n, unique axis c), and a trigonal or
hexagonal group its axes (hexagonal: alpha = beta = 90, gamma = 120; an R
group's rhombohedral axes: alpha = beta = gamma; those the symbol names,
or else the cell's), or the CIF is refused. An inconsistent symmetry
record gives a WARNING. The three cell lengths must be given; an angle
left out is 90 degrees.
A site whose occupancy is
not 1 (disorder, a vacancy) is refused, naming it: Tadah has one atom per
site. A CIF structure's label names the space group its cell is built
with, and the errors and warnings of a COD entry name its COD ID. A failed
fetch from any database (MP, COD, AFLOW, NOMAD) names the ID and the
service's reason (cut to 300 characters).
"""
