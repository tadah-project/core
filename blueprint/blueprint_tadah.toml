examples = []

[ALLOWED_KEYS.FIXWEIGHT]
INHERIT = ["TYPES.DOUBLES"]
description = "Values for weights to be fixed in optimization."
long_description = """
Must be used with FIXINDEX; a lone FIXWEIGHT (or lone FIXINDEX) is a hard
error, and there is no auto-seeding from WEIGHTS. dim(FIXINDEX) =
dim(FIXWEIGHT). The i-th value in FIXWEIGHT pins the model weight named by
the i-th index in FIXINDEX (declaration order defines the pairing). Pinned
weights are excluded from the least-squares solve; the remaining weights
are fitted against the residual target. Incompatible with NORM=true (the
values would be interpreted in the normalized feature space).

In `tadah hpo`, `OPTIM FIXWEIGHT (<weight-index>) <low> <high>` lets the
nonlinear optimiser search a pinned weight: the (indices) name MODEL
WEIGHTS (values of FIXINDEX), not positions in this list. When FIXINDEX
covers every model weight, the LS solve is skipped entirely; in that case
a training DBFILE becomes optional (the loss must then come from
validation metrics, PC_OBSERVABLE, or PC_LAMMPS, and the element set must
be declared via ATOM).
"""
examples = ["0.12 1.0 2.00"]

[ALLOWED_KEYS.FIXINDEX]
value_type   = ["{INDEX_PATTERN}"]
value_format = ["<index>[,<index>...]", "<start>-<stop>", "<start>-<stop>:<step>"]
value_N      = [-2147483647]
description = "Indices of weights to be fixed in optimization."
long_description = """
Must be used with FIXWEIGHT; a lone FIXINDEX (or lone FIXWEIGHT) is a hard
error. dim(FIXINDEX) = dim(FIXWEIGHT); the i-th index names the model
weight pinned by the i-th FIXWEIGHT value (declaration order defines the
pairing). Allows flexible selection of indices. Supports single indices,
ranges (e.g., start-stop), lists, or intervals (start-stop:step). Indices
are 1-based. Repeated indices are removed automatically. Without a
training DBFILE, FIXINDEX must cover every model weight (there is no data
to fit the rest).
"""
examples     = ["1,3,5", "1-4,7,9", "1-10:2"]

[ALLOWED_KEYS.task]
INHERIT = ["ALLOWED_KEYS.config"]
description = "A file containing task(s) to be executed."
long_description = """
The task file is a convenient way to specify multiple tasks without having to
provide all the command-line arguments for each task. The task file should be
in the same format as the configuration file, but it can also include additional
information such as the task name and any specific parameters for that task.
A task in a task file begins with the keyword 'TASK' followed by the task name.
The task name is simply a command to be executed or both command and subcommand.
The lines following the `TASK` keyword should contain parameters required for
the task specified above. For example, CLI `--verbose 2` is 'VERBOSE 2' in the
task file. Options above the first `TASK` line apply to every task, so a
`TASK` line with no parameter lines after it runs with those alone. Every task
name is checked, with or without parameters: an unknown one, or a command that
needs a subcommand (`TASK data` instead of `TASK data convert`), is an error
before any task runs.

# Example TASK file containing two tasks:
# Global options
NUMERIC 14 # output precision
VERBOSE 2  # verbosity level

TASK predict
DBFILE db1.tadah db2.tadah db3.tadah
DBFILE db4.tadah db5.tadah db6.tadah
FORCE true
ANALYTICS true

TASK data print
STRUCTURE crystal1.cif crystal2.cif
"""
