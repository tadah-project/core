long_description = """
N, then an N×N matrix in column-major order: the covariance of the weights
that a fit with OALGO 3 computes (M_BLR and M_KRR), which `tadah train`
writes into the potential and `tadah predict --error` reads.

A SIGMA belongs to the fit that computed it. A fit replaces the SIGMA of
its configuration (a potential used as the configuration, or the -c
potential of `tadah hpo`), and a fit that computes none (OALGO 1, 2 or 4,
M_KRR implementation 2, M_BLR with FIXINDEX pinning every weight, weights
set from FIXWEIGHT without training data in `tadah hpo`) writes none.
`tadah predict --error` refuses a SIGMA that does not hold N×N+1 values,
naming N and both counts.
"""
examples = ["2 1.2 2.2 2.3 3.3"]

[ALLOWED_KEYS.NSTDEV]
INHERIT = ["TYPES.DOUBLES"]
description = "Standard deviations from descriptor normalization."
long_description = """
Obtained after standardizing the columns of the DesignMatrix (see NORM).
The vector size equals the number of columns.
"""

[ALLOWED_KEYS.NMEAN]
INHERIT = ["TYPES.DOUBLES"]
description = "Mean values from descriptor normalization."
long_description = """
Obtained after standardizing the columns of the DesignMatrix (see NORM).
"""

[ALLOWED_KEYS.BASIS]
INHERIT = ["TYPES.DOUBLES"]
description = "Basis vectors for non-linear Kernel Ridge Regression."
long_description = """
The SBASIS basis vectors of a trained non-linear M_KRR potential, one after
another, each with the descriptor's length (SBASIS x descriptor size
values); `tadah train` writes them. A potential of a non-linear kernel with
WEIGHTS must carry SBASIS and BASIS, with one weight per basis vector:
`tadah predict`, `tadah hpo` and `pair_style tadah` refuse it otherwise,
and refuse a BASIS without SBASIS, a BASIS whose length is not a multiple
of SBASIS, and basis vectors whose length is not the descriptor's.

With BIAS true on several species (ATOM) the descriptor tadah trains has
one bias component shared by the species, while that of `pair_style tadah`
has one per species: `pair_style tadah` refuses such a potential of a
non-linear model, naming the cause. Train it with BIAS false to run it in
LAMMPS.
"""

