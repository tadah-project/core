###############################################################################
# Blueprint for ALLOWED_KEYS, INTERNAL_KEYS, and TASKS
###############################################################################
# ALLOWED_KEYS is a blueprint for the keys that can be used in the configuration file.
# The description of of ALLOWED_KEYS should be generic and not tied to any specific task.
# The tasks can inherit from ALLOWED_KEYS and add/override with own specific details.
# Each key has a set of properties that define its expected type, format, and constraints.
# The blueprint is used to validate the configuration file and to generate help messages.
# The blueprint is also used to generate the CLI and documentation.

# Fields:
# - value_type: Ordered list of expected types (one-to-one corresponding to value_format).
# - value_format: Human readable list showing expected tokens; a trailing "..." means the last <token> may repeat.
# - value_N: Maximum allowed tokens.
# - description: Short explanation. (used by cli for a brief description)
# - examples: Array of example values of the key: what follows the key on a
#   configuration line, never the key itself (an example of several lines is
#   one value per line, each a line of the key, as in a D2_mJoin). The
#   parser's refusal of a value and the configuration-keys page show each line
#   as "<KEY>   <value>"; the CLI pages show the values. A key written as a
#   block (INIT ... ENDINIT) has none (`examples = []`): its layout goes in its
#   description.
# - default_value: Default value (optional).
# - deprecated: Reason and replacement, for a key that is only still accepted
#   (optional). A configuration or potential file may contain the key; its value
#   is validated, a warning is written to standard error once per key and
#   process and the key is not stored.
#   A deprecated key must not have a default_value, a CLI flag or examples
#   (`examples = []` overrides those of an inherited TYPES table).

# Some ALLOWED_KEYS keys can be set via CLI flags or options. These keys have additional fields:
# CLI-specific fields:
# - cli_long_flag: Long option name.
# - cli_short_flag: Short option name.
# - long_description: Long description for the task used by the CLI and documentation
# - cli_excludes: List of CLI only keys (flags/options) that are mutually exclusive.
# - cli_required: Whether the key is required for the task.
#
# {} denotes repetition, [] denotes optional, <> denotes a placeholder, 
# capital letters denote a keyword.
#
# Inheritance rules:
#  - The INHERIT field is a list of keys to inherit from.
#  - ALLOWED_KEYS inherits fields from onther tables by using the INHERIT field.
#  - If field is present in both tables, the existing values override the inherited values.
#  - The INHERIT field can be used to inherit from multiple tables.
#  - TASKS can inherit from ALLOWED_KEYS however they insert keys under keys.newkey.
###############################################################################

