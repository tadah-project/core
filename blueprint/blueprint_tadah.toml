and the force and stress metrics when forces (-F) or stresses (-S) are
predicted. A structure stored with force weight 0 (fweight) is left out of
the force metrics, and one with stress weight 0 (sweight) out of the stress
metrics: it has no forces or stress tensor of its own (tadah data convert
stores zeros in their place). A dataset in which every structure has force
(stress) weight 0 is not measured: nan in its column, left out of the mean,
and a note names it. With -F (-S), a run in which no dataset has forces (a
stress tensor) is refused before predicting, and so, with or without them,
is a dataset that the filters (EFILTER, FFILTER) leave without structures. The training-only weight keys a potential records
(WDBFILE, WDBFILE_AUTO, EWEIGHT_TEMP) are not applied to the data predicted.
"""
