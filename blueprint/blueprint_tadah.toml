[ALLOWED_KEYS.numeric]
INHERIT = ["TYPES.UINT"]
description  = "Numeric output precision."
long_description = """
Sets the precision of numbers in written output files.

Potential files (pot.tadah written by train, refit, refit --edit and hpo) and
dataset files (written by tadah data convert, merge, split, sample, dedup and
balance): NUMERIC is the number of SIGNIFICANT digits (printf %.{N}g) of every
non-integer number of the potential's key/value lines, and of every number of
a dataset. The default 18 is exact: every double reads back bit-identically
(17 significant digits always suffice). An explicit NUMERIC below 17 is
honoured but warned about, because the written file then differs from the
values in memory. Integers in a potential are always written exactly.
NUMERIC itself is never written into a potential file; a NUMERIC line found in
a potential used as a configuration (or edited with refit --edit) is treated
as an explicit setting. The '#' comment headers of a potential (e.g. the
header tadah hpo writes) are annotations not governed by NUMERIC; its
machine-read lines (# HPO_BEST_LOSS, # HOT) are always exact.

The structure exports of tadah data write use significant digits too for
LAMMPS data files and VASP POSCAR (both read E-notation); the CASTEP cell
export keeps NUMERIC decimal places.

Values loaded into memory are never limited by NUMERIC, and calculations
always use full precision.

Other outputs (predictions, analysis tables) keep their established meaning
of the number of digits written.
"""
examples     = ["18"]
default_value = ["18"]
cli_long_flag  = "--numeric"
cli_short_flag = ""
cli_required   = false

