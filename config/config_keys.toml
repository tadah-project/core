[LAMBDA]
default = [0]
value_type = ['int | double']
value_format = ['N']
value_N = [-1]
description = '''
This key controls the regularization parameter :math:`\lambda` for both :cpp:class:`M_BLR` and :cpp:class:`M_KRR`. Regularization helps prevent overfitting by adding a penalty for larger parameter values during model training. The **default value** is :code:`0`, meaning no regularization is applied.

Available options:

- **:code:`LAMBDA 0`**: No regularization is applied. The model is trained without penalizing parameter magnitudes.

- **:code:`LAMBDA N`** (where :code:`N > 0`): Sets the regularization parameter :math:`\lambda` to the specified positive value :code:`N`. This applies a fixed amount of regularization during training.

- **:code:`LAMBDA -1`**: Uses an evidence-approximation algorithm to estimate the optimal value of :math:`\lambda`. This method adjusts the regularization parameter based on the data to balance model fit and complexity.

**Usage**:

- Set the :code:`LAMBDA` key followed by the desired value of :math:`\lambda`.

**Examples**:

- :code:`LAMBDA -1`       # Estimates :math:`\lambda` using the evidence-approximation algorithm.
- :code:`LAMBDA 1e-4`     # Sets :math:`\lambda` to :math:`1 \times 10^{-4}`.
- :code:`LAMBDA 0`        # Disables regularization.

**Notes**:

- **Regularization Parameter :math:`\lambda`**:

  - A higher value of :math:`\lambda` increases the amount of regularization, which can reduce overfitting but may lead to underfitting if set too high.
  - A lower positive value (close to zero) applies minimal regularization, allowing the model to fit the training data more closely.
  - Setting :code:`LAMBDA 0` disables regularization entirely, which may result in overfitting, especially with complex models or small datasets.

- **Evidence-Approximation Algorithm (:code:`LAMBDA -1`)**:

  - Automatically estimates the optimal value of :math:`\lambda` from the data.
  - Useful when it's difficult to choose an appropriate value for :math:`\lambda` manually.
  - May increase computation time due to the additional estimation process.

**Applications in Models**:

- **:cpp:class:`M_BLR` (Bayesian Linear Regression)** and **:cpp:class:`M_KRR` (Kernel Ridge Regression)**:

  - The :code:`LAMBDA` key influences the regularization applied in these models.
  - In Bayesian Linear Regression, regularization corresponds to the prior belief about the magnitude of the coefficients.
  - In Kernel Ridge Regression, regularization controls the trade-off between fitting the training data and maintaining smoothness in the function estimate.

**Additional Information**:

- **Combining with :ref:`OALGO`**:

  - The regularization parameter :math:`\lambda` works in conjunction with the optimization algorithm selected by the :code:`OALGO` key.
  - Ensure that both keys are set appropriately to achieve the desired balance between performance, robustness, and regularization.

'''
examples = ['LAMBDA -1', 'LAMBDA 1e-4', 'LAMBDA 0']
is_internal = [false]

