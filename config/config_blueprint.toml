###############################################################################
# Blueprint for Allowed Keys (ALLOWED_KEYS)
###############################################################################
# ALLOWED_KEYS is a blueprint for the keys that can be used in the configuration file.
# The description of of ALLOWED_KEYS should be generic and not tied to any specific task.
# The tasks can inherit from ALLOWED_KEYS and add/override with own specific details.
# Each key has a set of properties that define its expected type, format, and constraints.
# The blueprint is used to validate the configuration file and to generate help messages.
# The blueprint is also used to generate the CLI help messages and documenation.

# Fields:
# - value_type: Ordered list of expected types (one-to-one corresponding to value_format).
# - value_format: List showing expected tokens; a trailing "..." means the last token repeats.
# - value_N: Maximum allowed tokens.
# - description: Short explanation.
# - examples: Array of valid example usage strings.
# - default: Default value (if applicable).

# Some ALLOWED_KEYS keys can be set via CLI flags or options. These keys have additional fields:
# CLI-specific fields:
# - long_flag: Long flag name.
# - short_flag: Short flag name.
# - long_option: Long option name.
# - short_option: Short option name.
# - long_description: Long description for the task.
# - excludes: List of keys (flags/options) that are mutually exclusive.
# - required: Whether the key is required for the task.
#
###############################################################################

[ALLOWED_KEYS.config]
value_type   = ["string"]
value_format = ["<path>"]
value_N      = [1]
description  = "Path to configuration file."
examples     = ["config.tadah"]
long_option  = "--config"
short_option = "-c"

