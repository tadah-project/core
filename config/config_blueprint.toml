description  = "Specifies the width parameters for the radial basis functions in two-body descriptors (e.g., Gaussian widths). The widths can be supplied manually or auto-generated. When using the meta descriptor D2_mJoin, provide one or more lists of width values corresponding to each concatenated descriptor, ensuring that the number of widths matches the number of centers (CGRID2B). Alternatively, include the algorithm keyword with its parameters to generate the widths automatically using the same available schemes (logarithmic or uniform spacing)."
examples     = [
    "SGRID2B U 3 0 1.0",
    "SGRID2B -2 6 0.1 10",
    """SGRID2B   0.01 0.02 0.03
SGRID2B   -2 6 0.1 10"""
]

