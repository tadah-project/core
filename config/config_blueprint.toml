    [TASKS.data.read.structure]
    required = true
    excludes   = ["dbfile"]

  [TASKS.data.write]
  description      = "Write structures from a dataset into a chosen format."
  long_description = "Write structures from a dataset into a chosen format.\nExample: tadah data write -d dataset.tadah -o output.cell -f cell -i 7"
  examples         = ["tadah data write -d dataset.tadah -o output.cell -f cell -i 7"]
  INHERIT          = ["TASKS.dbfile", "TASKS.outfile", "TASKS.indices", "TASKS.format", "TASKS.numeric", "TASKS.verbose"]
    [TASKS.data.write.dbfile]
