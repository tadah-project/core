    [TASKS.data.convert.outfile]
    required = true

  [TASKS.data.read]
  description      = "Read and print structures from dataset or structure files."
  long_description = "Read and print structures from dataset or structure files.\nExample: tadah data read -d dataset.tadah"
  examples         = ["tadah data read -d dataset.tadah", "tadah data read -s crystal.cif"]
  INHERIT          = ["TASKS.dbfile", "TASKS.structure", "TASKS.indices", "TASKS.numeric", "TASKS.verbose"]
    [TASKS.data.read.dbfile]
