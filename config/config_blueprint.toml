description  = "Controls the center positions for the radial basis functions in two-body descriptors (e.g., Gaussian centers). The parameter list may be provided manually or generated automatically. When using the meta descriptor D2_mJoin, specify one or more lists of centers corresponding to each concatenated descriptor. The number of centers should typically match the number of width parameters provided via SGRID2B and remain below the cutoff distance. Alternatively, use the algorithm keyword followed by the parameters to generate the centers automatically. Available algorithms include numbers spaced evenly on a log scale (e.g. 'LOG') or linear scale (e.g. 'LIN')."
examples     = [
    "CGRID2B LIN 10 0 6",
    "CGRID2B 1.0 2.0",
    """CGRID2B   1.0 2.0
CGRID2B   1.5 2.5"""
]

